version: '3.8'

services:
  multilingual-journal:
    build:
      context: ./MultilingualJournalApp
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    volumes:
      # Mount a volume for SQLite database persistence
      - journal_data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/journal.db
    restart: unless-stopped

volumes:
  journal_data:
    driver: local