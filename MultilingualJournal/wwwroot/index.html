<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Journal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#" onclick="showHome()">📖 Multilingual Journal</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#" onclick="showHome()">Home</a>
                <a class="nav-link" href="#" onclick="showNewEntry()">New Entry</a>
                <a class="nav-link" href="#" onclick="showTags()">Tags</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Home View -->
        <div id="home-view">
            <div class="row mb-3">
                <div class="col-md-8">
                    <h2>Journal Entries</h2>
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="search-input" placeholder="Search entries...">
                        <button class="btn btn-outline-secondary" type="button" onclick="searchEntries()">Search</button>
                    </div>
                </div>
            </div>
            <div id="entries-container">
                <!-- Entries will be loaded here -->
            </div>
        </div>

        <!-- New Entry View -->
        <div id="new-entry-view" style="display: none;">
            <h2>New Journal Entry</h2>
            <form id="entry-form">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" required>
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label">Content</label>
                    <textarea class="form-control" id="content" rows="10" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="language" class="form-label">Language</label>
                    <select class="form-select" id="language">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="tags" class="form-label">Tags</label>
                    <input type="text" class="form-control" id="tags" placeholder="Enter tags separated by commas">
                    <div class="form-text">Add milestone tag by typing 'milestone:' before the tag name</div>
                </div>
                <button type="submit" class="btn btn-primary">Save Entry</button>
                <button type="button" class="btn btn-secondary" onclick="showHome()">Cancel</button>
            </form>
        </div>

        <!-- Tags View -->
        <div id="tags-view" style="display: none;">
            <h2>Tags & Milestones</h2>
            <div class="row">
                <div class="col-md-6">
                    <h4>Milestone Tags</h4>
                    <div id="milestone-tags">
                        <!-- Milestone tags will be loaded here -->
                    </div>
                </div>
                <div class="col-md-6">
                    <h4>Regular Tags</h4>
                    <div id="regular-tags">
                        <!-- Regular tags will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Entry Detail Modal -->
    <div class="modal fade" id="entryModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="entryModalTitle">Entry Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="entryModalBody">
                    <!-- Entry details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="translateEntry()">Translate</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
